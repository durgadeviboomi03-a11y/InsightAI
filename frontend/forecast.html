<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forecast — InsightAI</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ---------- Navigation ---------- -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="bi bi-graph-up-arrow"></i> InsightAI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="upload.html">Upload</a></li>
                    <li class="nav-item"><a class="nav-link" href="charts.html">Charts</a></li>
                    <li class="nav-item"><a class="nav-link" href="chat.html">AI Chat</a></li>
                    <li class="nav-item"><a class="nav-link active" href="forecast.html">Forecast</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Log Out</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">

        <h2 class="fw-bold mb-1">Forecasting</h2>
        <p class="text-muted mb-4">Predict future values based on historical trends in your data.</p>

        <!-- ---------- Forecast Configuration ---------- -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-bold">
                <i class="bi bi-sliders"></i> Configure Forecast
            </div>
            <div class="card-body">
                <div id="forecastAlert" class="alert d-none"></div>
                <form id="forecastForm" class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label">Dataset</label>
                        <select class="form-select" id="forecastDatasetSelector" required>
                            <option value="">Select a dataset...</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Date Column</label>
                        <select class="form-select" id="dateColumnSelector" required disabled>
                            <option value="">Select dataset first...</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Value Column</label>
                        <select class="form-select" id="valueColumnSelector" required disabled>
                            <option value="">Select dataset first...</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Periods Ahead</label>
                        <input type="number" class="form-control" id="periodsAhead" value="30" min="1" max="365" required>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100" id="forecastBtn">
                            <span id="forecastSpinner" class="spinner-border spinner-border-sm d-none"></span>
                            <i class="bi bi-play-fill"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ---------- Forecast Result ---------- -->
        <div id="forecastLoading" class="text-center py-5 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Generating forecast...</p>
        </div>

        <div id="forecastResult" class="card border-0 shadow-sm d-none">
            <div class="card-header bg-white fw-bold">
                <i class="bi bi-graph-up"></i> Forecast Result
            </div>
            <div class="card-body">
                <canvas id="forecastChart" height="90"></canvas>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        // ---------- Auth guard ----------
        (function authGuard() {
            const token = localStorage.getItem('insightai_access_token');
            if (!token) {
                window.location.href = 'login.html';
            }
        })();

        document.getElementById('logoutBtn').addEventListener('click', function (event) {
            event.preventDefault();
            localStorage.removeItem('insightai_access_token');
            localStorage.removeItem('insightai_refresh_token');
            window.location.href = 'login.html';
        });

        // ---------- Forecast page logic ----------
        // NOTE: kept inline for now (no dedicated js/forecast.js exists in our
        // file order — forecasting functionality is covered by js/api.js + app.js).

        let forecastChartInstance = null;

        function showForecastAlert(message, type) {
            const el = document.getElementById('forecastAlert');
            el.className = `alert alert-${type}`;
            el.textContent = message;
            el.classList.remove('d-none');
        }

        // ---------- Populate dataset dropdown ----------
        async function populateDatasetSelector() {
            const selector = document.getElementById('forecastDatasetSelector');
            try {
                if (typeof listDatasets !== 'function') {
                    throw new Error('API layer not yet available.');
                }
                const datasets = await listDatasets();
                datasets.filter(d => d.status === 'ready').forEach(dataset => {
                    const option = document.createElement('option');
                    option.value = dataset.public_id;
                    option.textContent = dataset.original_filename;
                    selector.appendChild(option);
                });
            } catch (error) {
                showForecastAlert(`Could not load datasets: ${error.message}`, 'danger');
            }
        }

        // ---------- When a dataset is selected, populate its column dropdowns ----------
        document.getElementById('forecastDatasetSelector').addEventListener('change', async function () {
            const dateSelector = document.getElementById('dateColumnSelector');
            const valueSelector = document.getElementById('valueColumnSelector');

            dateSelector.innerHTML = '<option value="">Loading columns...</option>';
            valueSelector.innerHTML = '<option value="">Loading columns...</option>';
            dateSelector.disabled = true;
            valueSelector.disabled = true;

            if (!this.value) {
                dateSelector.innerHTML = '<option value="">Select dataset first...</option>';
                valueSelector.innerHTML = '<option value="">Select dataset first...</option>';
                return;
            }

            try {
                if (typeof getDatasetOverview !== 'function') {
                    throw new Error('API layer not yet available.');
                }
                const overview = await getDatasetOverview(this.value);

                // All columns are candidates for the date column (we can't be
                // fully sure which is date-like from overview alone).
                dateSelector.innerHTML = overview.column_names
                    .map(col => `<option value="${col}">${col}</option>`)
                    .join('');
                dateSelector.disabled = false;

                // Only numeric columns are valid forecast targets.
                const numericColumns = Object.keys(overview.numeric_summary);
                valueSelector.innerHTML = numericColumns.length > 0
                    ? numericColumns.map(col => `<option value="${col}">${col}</option>`).join('')
                    : '<option value="">No numeric columns available</option>';
                valueSelector.disabled = numericColumns.length === 0;

            } catch (error) {
                showForecastAlert(`Could not load dataset columns: ${error.message}`, 'danger');
            }
        });

        // ---------- Render forecast chart ----------
        function renderForecastChart(dates, predicted, lower, upper) {
            if (forecastChartInstance) {
                forecastChartInstance.destroy();
            }
            const ctx = document.getElementById('forecastChart');
            forecastChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: 'Predicted',
                            data: predicted,
                            borderColor: '#4C72B0',
                            backgroundColor: 'rgba(76, 114, 176, 0.1)',
                            tension: 0.3,
                        },
                        {
                            label: 'Upper Bound',
                            data: upper,
                            borderColor: 'rgba(76, 114, 176, 0.3)',
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false,
                        },
                        {
                            label: 'Lower Bound',
                            data: lower,
                            borderColor: 'rgba(76, 114, 176, 0.3)',
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: '-1',
                            backgroundColor: 'rgba(76, 114, 176, 0.08)',
                        },
                    ],
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom' } },
                    scales: { y: { beginAtZero: false } },
                },
            });
        }

        // ---------- Forecast form submission ----------
        document.getElementById('forecastForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const datasetId = document.getElementById('forecastDatasetSelector').value;
            const dateColumn = document.getElementById('dateColumnSelector').value;
            const valueColumn = document.getElementById('valueColumnSelector').value;
            const periodsAhead = parseInt(document.getElementById('periodsAhead').value, 10);

            if (!datasetId || !dateColumn || !valueColumn) {
                showForecastAlert('Please select a dataset, date column, and value column.', 'warning');
                return;
            }

            const forecastBtn = document.getElementById('forecastBtn');
            const spinner = document.getElementById('forecastSpinner');
            document.getElementById('forecastAlert').classList.add('d-none');
            document.getElementById('forecastResult').classList.add('d-none');
            document.getElementById('forecastLoading').classList.remove('d-none');
            forecastBtn.disabled = true;
            spinner.classList.remove('d-none');

            try {
                if (typeof createForecast !== 'function') {
                    throw new Error('API layer not yet available. This will work once js/api.js is created.');
                }
                const result = await createForecast(datasetId, dateColumn, valueColumn, periodsAhead);

                document.getElementById('forecastLoading').classList.add('d-none');
                document.getElementById('forecastResult').classList.remove('d-none');
                renderForecastChart(result.dates, result.predicted_values, result.confidence_lower, result.confidence_upper);

            } catch (error) {
                document.getElementById('forecastLoading').classList.add('d-none');
                showForecastAlert(error.message, 'danger');
            } finally {
                forecastBtn.disabled = false;
                spinner.classList.add('d-none');
            }
        });

        populateDatasetSelector();
    </script>
</body>
</html>
