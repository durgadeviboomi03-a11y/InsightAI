<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — InsightAI</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ---------- Navigation ---------- -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="bi bi-graph-up-arrow"></i> InsightAI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="upload.html">Upload</a></li>
                    <li class="nav-item"><a class="nav-link" href="charts.html">Charts</a></li>
                    <li class="nav-item"><a class="nav-link" href="chat.html">AI Chat</a></li>
                    <li class="nav-item"><a class="nav-link" href="forecast.html">Forecast</a></li>
                    <li class="nav-item"><a class="nav-link active" href="reports.html">Reports</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Log Out</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">

        <h2 class="fw-bold mb-1">Reports</h2>
        <p class="text-muted mb-4">Generate polished PDF, Excel, or CSV reports from your datasets.</p>

        <!-- ---------- Generate New Report ---------- -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-bold">
                <i class="bi bi-file-earmark-plus"></i> Generate New Report
            </div>
            <div class="card-body">
                <div id="generateAlert" class="alert d-none"></div>
                <form id="generateReportForm" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">Dataset</label>
                        <select class="form-select" id="reportDatasetSelector" required>
                            <option value="">Select a dataset...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Report Title</label>
                        <input type="text" class="form-control" id="reportTitle" placeholder="e.g. Q3 Sales Summary" maxlength="255" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Format</label>
                        <select class="form-select" id="reportFormat" required>
                            <option value="pdf">PDF</option>
                            <option value="excel">Excel</option>
                            <option value="csv">CSV</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100" id="generateBtn">
                            <span id="generateSpinner" class="spinner-border spinner-border-sm d-none"></span>
                            Generate
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ---------- Existing Reports ---------- -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white fw-bold">
                <i class="bi bi-file-earmark-text"></i> Your Reports
            </div>
            <div class="card-body p-0">
                <div id="reportsLoading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="text-muted mt-2">Loading reports...</p>
                </div>

                <div id="reportsEmpty" class="text-center py-5 d-none">
                    <i class="bi bi-inbox display-4 text-muted"></i>
                    <p class="text-muted mt-2 mb-0">No reports generated yet.</p>
                </div>

                <div class="table-responsive d-none" id="reportsTableWrapper">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Title</th>
                                <th>Format</th>
                                <th>Generated</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reportsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        // ---------- Auth guard ----------
        (function authGuard() {
            const token = localStorage.getItem('insightai_access_token');
            if (!token) {
                window.location.href = 'login.html';
            }
        })();

        document.getElementById('logoutBtn').addEventListener('click', function (event) {
            event.preventDefault();
            localStorage.removeItem('insightai_access_token');
            localStorage.removeItem('insightai_refresh_token');
            window.location.href = 'login.html';
        });

        // ---------- Reports page logic ----------
        // NOTE: kept inline for now (no dedicated js/reports.js exists in our
        // file order — reports functionality is covered by js/api.js + app.js).

        const formatBadgeMap = { pdf: 'bg-danger', excel: 'bg-success', csv: 'bg-secondary' };

        function formatBadge(format) {
            return `<span class="badge ${formatBadgeMap[format] || 'bg-secondary'}">${format.toUpperCase()}</span>`;
        }

        function showGenerateAlert(message, type) {
            const el = document.getElementById('generateAlert');
            el.className = `alert alert-${type}`;
            el.textContent = message;
            el.classList.remove('d-none');
        }

        // ---------- Populate dataset dropdown ----------
        async function populateDatasetSelector() {
            const selector = document.getElementById('reportDatasetSelector');
            try {
                if (typeof listDatasets !== 'function') {
                    throw new Error('API layer not yet available.');
                }
                const datasets = await listDatasets();
                datasets.filter(d => d.status === 'ready').forEach(dataset => {
                    const option = document.createElement('option');
                    option.value = dataset.public_id;
                    option.textContent = dataset.original_filename;
                    selector.appendChild(option);
                });
            } catch (error) {
                showGenerateAlert(`Could not load datasets: ${error.message}`, 'danger');
            }
        }

        // ---------- Load existing reports ----------
        async function loadReports() {
            const loadingEl = document.getElementById('reportsLoading');
            const emptyEl = document.getElementById('reportsEmpty');
            const tableWrapperEl = document.getElementById('reportsTableWrapper');
            const tableBodyEl = document.getElementById('reportsTableBody');

            try {
                if (typeof listReports !== 'function') {
                    throw new Error('API layer not yet available.');
                }
                const reports = await listReports();
                loadingEl.classList.add('d-none');

                if (reports.length === 0) {
                    emptyEl.classList.remove('d-none');
                    return;
                }

                renderReportsTable(reports);
                tableWrapperEl.classList.remove('d-none');

            } catch (error) {
                loadingEl.innerHTML = `<p class="text-danger">Could not load reports: ${error.message}</p>`;
            }
        }

        function renderReportsTable(reports) {
            const tableBodyEl = document.getElementById('reportsTableBody');
            tableBodyEl.innerHTML = reports.map(report => `
                <tr data-report-id="${report.public_id}">
                    <td>${report.title}</td>
                    <td>${formatBadge(report.format)}</td>
                    <td>${new Date(report.created_at).toLocaleString()}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary download-report-btn" data-id="${report.public_id}">
                            <i class="bi bi-download"></i> Download
                        </button>
                        <button class="btn btn-sm btn-outline-danger delete-report-btn" data-id="${report.public_id}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

            tableBodyEl.querySelectorAll('.download-report-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    // NOTE: downloadReport() will trigger a browser download via
                    // the /reports/{id}/download endpoint (defined in js/api.js).
                    if (typeof downloadReport === 'function') {
                        downloadReport(btn.dataset.id);
                    }
                });
            });

            tableBodyEl.querySelectorAll('.delete-report-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Delete this report? This cannot be undone.')) return;
                    try {
                        if (typeof deleteReport === 'function') {
                            await deleteReport(btn.dataset.id);
                            loadReports();
                        }
                    } catch (error) {
                        alert(`Could not delete report: ${error.message}`);
                    }
                });
            });
        }

        // ---------- Generate report form submission ----------
        document.getElementById('generateReportForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const datasetId = document.getElementById('reportDatasetSelector').value;
            const title = document.getElementById('reportTitle').value.trim();
            const format = document.getElementById('reportFormat').value;

            const generateBtn = document.getElementById('generateBtn');
            const spinner = document.getElementById('generateSpinner');

            generateBtn.disabled = true;
            spinner.classList.remove('d-none');
            document.getElementById('generateAlert').classList.add('d-none');

            try {
                if (typeof createReport !== 'function') {
                    throw new Error('API layer not yet available. This will work once js/api.js is created.');
                }
                await createReport(datasetId, title, format);
                showGenerateAlert('Report generated successfully!', 'success');
                document.getElementById('reportTitle').value = '';
                loadReports();
            } catch (error) {
                showGenerateAlert(error.message, 'danger');
            } finally {
                generateBtn.disabled = false;
                spinner.classList.add('d-none');
            }
        });

        populateDatasetSelector();
        loadReports();
    </script>
</body>
</html>
