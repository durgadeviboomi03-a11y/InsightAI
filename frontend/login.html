<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — InsightAI</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ---------- Navigation ---------- -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-graph-up-arrow"></i> InsightAI
            </a>
        </div>
    </nav>

    <!-- ---------- Login Form ---------- -->
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 85vh;">
        <div class="card shadow-sm border-0" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4 p-md-5">
                <h2 class="fw-bold text-center mb-1">Welcome Back</h2>
                <p class="text-muted text-center mb-4">Log in to your InsightAI account</p>

                <!-- Alert box for login errors, hidden by default -->
                <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                                minlength="8"
                            >
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback">Password must be at least 8 characters.</div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary" id="loginSubmitBtn">
                            <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                            Log In
                        </button>
                    </div>

                    <p class="text-center text-muted mb-0">
                        Don't have an account? <a href="register.html">Sign up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        // ---------- Toggle password visibility ----------
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            icon.classList.toggle('bi-eye');
            icon.classList.toggle('bi-eye-slash');
        });

        // ---------- Login form submission ----------
        const loginForm = document.getElementById('loginForm');
        const loginAlert = document.getElementById('loginAlert');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');
        const loginSpinner = document.getElementById('loginSpinner');

        function showLoginError(message) {
            loginAlert.textContent = message;
            loginAlert.classList.remove('d-none');
        }

        function hideLoginError() {
            loginAlert.classList.add('d-none');
        }

        function setLoginLoading(isLoading) {
            loginSubmitBtn.disabled = isLoading;
            loginSpinner.classList.toggle('d-none', !isLoading);
        }

        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            hideLoginError();

            // Bootstrap client-side validation check.
            if (!loginForm.checkValidity()) {
                event.stopPropagation();
                loginForm.classList.add('was-validated');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            setLoginLoading(true);

            try {
                // NOTE: loginUser() is defined in js/api.js (not yet created —
                // file #40 in our sequence). Once that file exists, this call
                // will POST to /api/auth/login and store the returned tokens.
                if (typeof loginUser !== 'function') {
                    throw new Error('API layer not yet available. This will work once js/api.js is created.');
                }

                const tokens = await loginUser(email, password);
                localStorage.setItem('insightai_access_token', tokens.access_token);
                localStorage.setItem('insightai_refresh_token', tokens.refresh_token);
                window.location.href = 'dashboard.html';

            } catch (error) {
                showLoginError(error.message || 'Login failed. Please check your credentials and try again.');
            } finally {
                setLoginLoading(false);
            }
        });
    </script>
</body>
</html>
